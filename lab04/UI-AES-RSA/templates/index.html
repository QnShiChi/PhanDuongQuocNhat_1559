<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure Chat AES-RSA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body class="bg-body-tertiary">
    <div class="container py-4">
      <div class="row g-3">
        <div class="col-lg-4">
          <div class="card shadow-sm border-0 mb-3">
            <div class="card-body">
              <span class="badge text-bg-primary mb-2">AES-RSA</span>
              <h1 class="h4 mb-2">Secure Chat qua Server</h1>
              <p class="text-secondary small mb-3">
                Demo nhiều client chat thật qua server với handshake RSA và phiên mã hóa AES.
              </p>

              <div class="mb-3">
                <label for="displayName" class="form-label">Tên hiển thị</label>
                <input id="displayName" class="form-control" maxlength="30" placeholder="Ví dụ: Nhật">
              </div>

              <div class="d-grid gap-2">
                <button id="connectBtn" class="btn btn-primary">Kết nối</button>
                <button id="disconnectBtn" class="btn btn-outline-secondary" disabled>Ngắt kết nối</button>
              </div>
            </div>
          </div>

          <div class="card shadow-sm border-0 mb-3">
            <div class="card-body">
              <h2 class="h6">Thông tin phiên</h2>
              <div id="sessionInfo" class="small text-secondary"></div>
            </div>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h2 class="h6">Người đang online</h2>
              <ul id="onlineUsers" class="list-group list-group-flush online-list"></ul>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card shadow-sm border-0 mb-3">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h2 class="h6 mb-0">Nhật ký bảo mật</h2>
                <span class="badge text-bg-light" id="statusBadge">Chưa kết nối</span>
              </div>
              <div id="securityLog" class="log-panel"></div>
            </div>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h2 class="h6">Phòng chat chung</h2>
              <div id="chatMessages" class="chat-panel mb-3"></div>
              <div class="input-group">
                <input id="messageInput" class="form-control" placeholder="Nhập tin nhắn..." disabled>
                <button id="sendBtn" class="btn btn-success" disabled>Gửi</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
